<title>思考力道場</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=DM+Mono:wght@400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1f1f1f;
    --border: #2a2a2a;
    --accent: #c8f57a;
    --accent2: #7af5c8;
    --text: #e8e8e0;
    --muted: #6b6b60;
    --danger: #f57a7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; min-height: 100vh; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 24px 40px; border-bottom: 1px solid var(--border); }
  .logo { font-size: 18px; font-weight: 800; color: var(--accent); }
  .logo span { color: var(--text); }
  .streak { display: flex; align-items: center; gap: 8px; font-family: 'DM Mono', monospace; font-size: 13px; color: var(--muted); }
  .streak-num { background: var(--surface2); border: 1px solid var(--border); padding: 4px 12px; border-radius: 20px; color: var(--accent); }
  .tabs { display: flex; padding: 0 40px; border-bottom: 1px solid var(--border); }
  .tab { padding: 16px 24px; font-size: 13px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer; border: none; background: none; color: var(--muted); border-bottom: 2px solid transparent; transition: all 0.2s; font-family: 'Syne', sans-serif; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  main { padding: 40px; max-width: 860px; margin: 0 auto; }
  .section { display: none; }
  .section.active { display: block; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; margin-bottom: 20px; }
  .card-label { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .chip { padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: 'Syne', sans-serif; transition: all 0.15s; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.active { background: var(--accent); color: #0d0d0d; border-color: var(--accent); }
  .question-box { background: var(--surface2); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 12px; padding: 24px 28px; margin-bottom: 20px; font-family: 'Noto Serif JP', serif; font-size: 16px; line-height: 1.85; color: var(--text); min-height: 72px; }
  .question-box.placeholder { color: var(--muted); font-size: 14px; font-style: italic; border-left-color: var(--border); }
  .hint-box { background: var(--surface2); border: 1px solid var(--border); border-left: 3px solid #5a5a50; border-radius: 12px; padding: 18px 24px; margin-bottom: 20px; font-family: 'Noto Serif JP', serif; font-size: 13px; line-height: 1.8; color: var(--muted); display: none; }
  .hint-box.visible { display: block; }
  .hint-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #5a5a50; margin-bottom: 8px; }
  textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 20px; color: var(--text); font-family: 'Noto Serif JP', serif; font-size: 15px; line-height: 1.8; resize: vertical; min-height: 140px; outline: none; transition: border-color 0.2s; }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }
  textarea:disabled { opacity: 0.4; }
  .btn-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; align-items: center; }
  .btn { padding: 11px 22px; border-radius: 10px; border: none; font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.15s; }
  .btn-primary { background: var(--accent); color: #0d0d0d; }
  .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }
  .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }
  .timer-row { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  .timer { font-family: 'DM Mono', monospace; font-size: 32px; font-weight: 500; color: var(--accent); min-width: 84px; }
  .timer.warning { color: var(--danger); }
  .progress-bar { flex: 1; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 1s linear; }
  .feedback-box { background: var(--surface2); border: 1px solid var(--accent2); border-radius: 12px; padding: 24px 28px; margin-top: 20px; display: none; animation: fadeIn 0.35s ease; }
  .feedback-box.visible { display: block; }
  .feedback-label { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent2); margin-bottom: 12px; }
  .feedback-text { font-family: 'Noto Serif JP', serif; font-size: 14px; line-height: 1.85; color: var(--text); }
  .rubric { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .rubric-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .rubric-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .rubric-stars { font-size: 15px; letter-spacing: 2px; }
  .model-answer { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent2); border-radius: 12px; padding: 18px 22px; margin-top: 16px; font-family: 'Noto Serif JP', serif; font-size: 14px; line-height: 1.85; color: var(--text); }
  .model-label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent2); margin-bottom: 10px; }
  .history-item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; margin-bottom: 12px; }
  .history-meta { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; }
  .history-q { font-size: 13px; color: var(--muted); margin-bottom: 6px; font-family: 'Noto Serif JP', serif; }
  .history-a { font-size: 14px; color: var(--text); font-family: 'Noto Serif JP', serif; line-height: 1.6; }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); font-family: 'Noto Serif JP', serif; }
  .counter { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); margin-left: auto; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<header>
  <div class="logo">思考力<span>道場</span></div>
  <div class="streak">連続日数 <span class="streak-num" id="streak-display">0日</span></div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('hypothesis')">仮説思考</button>
  <button class="tab" onclick="switchTab('ai')">AI活用</button>
  <button class="tab" onclick="switchTab('history')">履歴</button>
</div>

<main>
  <!-- 仮説思考 -->
  <div id="section-hypothesis" class="section active">
    <div class="card">
      <div class="card-label">仮説思考ドリル — 90秒で3つの仮説を立てる</div>
      <div class="chips">
        <button class="chip active" onclick="selectChip(this,'hyp','ビジネス')">ビジネス</button>
        <button class="chip" onclick="selectChip(this,'hyp','マーケ')">マーケ</button>
        <button class="chip" onclick="selectChip(this,'hyp','組織')">組織</button>
        <button class="chip" onclick="selectChip(this,'hyp','市場')">市場</button>
      </div>
      <div class="question-box placeholder" id="hyp-question">「例題を出す」を押してください</div>
      <div class="timer-row" id="hyp-timer-row" style="display:none">
        <div class="timer" id="hyp-timer">01:30</div>
        <div class="progress-bar"><div class="progress-fill" id="hyp-progress" style="width:100%"></div></div>
      </div>
      <textarea id="hyp-answer" placeholder="仮説① なぜなら…&#10;仮説② あるいは…&#10;仮説③ もしくは…&#10;&#10;— 正解より「量とスピード」を優先 —" disabled></textarea>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="getHypQuestion()">📋 例題を出す</button>
        <button class="btn btn-secondary" id="hyp-timer-btn" onclick="startTimer()" disabled>⏱ タイマー開始</button>
        <button class="btn btn-secondary" id="hyp-hint-btn" onclick="toggleHint('hyp-hint')" disabled>💡 ヒント</button>
        <button class="btn btn-secondary" id="hyp-submit-btn" onclick="submitHyp()" disabled>✦ 採点する</button>
        <span class="counter" id="hyp-counter"></span>
      </div>
    </div>
    <div class="hint-box" id="hyp-hint">
      <div class="hint-label">考える軸のヒント</div>
      <div id="hyp-hint-text"></div>
    </div>
    <div class="feedback-box" id="hyp-feedback">
      <div class="feedback-label">採点結果</div>
      <div class="feedback-text" id="hyp-fb-text"></div>
      <div class="rubric" id="hyp-rubric"></div>
      <div class="model-answer">
        <div class="model-label">模範仮説の例</div>
        <div id="hyp-model-text"></div>
      </div>
    </div>
  </div>

  <!-- AI活用 -->

  <div id="section-ai" class="section">
    <div class="card">
      <div class="card-label">AIプロンプト設計ドリル</div>
      <div class="chips">
        <button class="chip active" onclick="selectChip(this,'ai','提案')">提案</button>
        <button class="chip" onclick="selectChip(this,'ai','分析')">分析</button>
        <button class="chip" onclick="selectChip(this,'ai','交渉')">交渉</button>
        <button class="chip" onclick="selectChip(this,'ai','報告')">報告</button>
      </div>
      <div class="question-box placeholder" id="ai-question">「シナリオを出す」を押してください</div>
      <textarea id="ai-answer" placeholder="設計するプロンプトを書いてください&#10;&#10;【役割】あなたは〇〇の専門家です。&#10;【制約】〜という条件で&#10;【出力】〜の形式で〜してください" disabled></textarea>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="getAiQuestion()">📋 シナリオを出す</button>
        <button class="btn btn-secondary" id="ai-hint-btn" onclick="toggleHint('ai-hint')" disabled>💡 ヒント</button>
        <button class="btn btn-secondary" id="ai-submit-btn" onclick="submitAi()" disabled>✦ 採点する</button>
        <span class="counter" id="ai-counter"></span>
      </div>
    </div>
    <div class="hint-box" id="ai-hint">
      <div class="hint-label">良いプロンプトの3要素</div>
      <div id="ai-hint-text"></div>
    </div>
    <div class="feedback-box" id="ai-feedback">
      <div class="feedback-label">採点結果</div>
      <div class="feedback-text" id="ai-fb-text"></div>
      <div class="rubric" id="ai-rubric"></div>
      <div class="model-answer">
        <div class="model-label">模範プロンプトの例</div>
        <div id="ai-model-text"></div>
      </div>
    </div>
  </div>

  <!-- 履歴 -->

  <div id="section-history" class="section">
    <div class="card">
      <div class="card-label">トレーニング履歴</div>
      <div id="history-list"></div>
    </div>
  </div>
</main>

<script>
const BANK = {
  hyp: {
    ビジネス: [
      { q:"老舗百貨店の売上が5年連続で下落している。なぜか？", hint:"①顧客層の変化　②競合環境の変化　③商品・体験価値の陳腐化 の3軸で考える", model:"①コアターゲット（50〜60代）の節約志向強まり + EC移行\n②専門店・アウトレット・ECの台頭で「品揃え優位」が消失\n③インバウンド集中で地元顧客との関係性が希薄化した"},
      { q:"SaaSスタートアップが資金調達直後に離職率が上がる傾向がある。なぜか？", hint:"①創業期メンバーの心理変化　②急拡大採用の弊害　③文化の変質 で考える", model:"①IPO/Exit前提で入社した初期メンバーが「ゴール」と感じ次へ向かう\n②急募採用で文化フィットしない人材が増え既存メンバーが居心地悪くなる\n③意思決定が遅くなりスタートアップらしさが失われエンジニア・営業が離脱"},
      { q:"コンビニの新商品の約7割が3ヶ月以内に棚から消える。なぜこの構造が続くのか？", hint:"①仕入れ側の意図　②消費者行動　③棚スペースの経済学 で考える", model:"①仮説検証コストが低く失敗しても学習データが得られる\n②新商品への「試し買い」需要自体がコンビニの集客に貢献している\n③定番商品の安定利益があるため新商品の失敗リスクを許容できる"},
      { q:"黒字にもかかわらず突然閉店する飲食チェーンがある。なぜか？", hint:"①財務構造（利益≠キャッシュ）　②不動産・固定費　③戦略的判断 で考える", model:"①売上は立つが家賃・人件費の固定費でキャッシュフローが悪化\n②より利益率の高い立地・業態への転換を優先し戦略的撤退を選択\n③フランチャイズオーナーのモチベ低下・後継者不在による自発的閉店"},
    ],
    マーケ: [
      { q:"高評価レビューが多い商品より、賛否両論の商品の方が売れることがある。なぜか？", hint:"①口コミの拡散性　②消費者の選択行動　③ターゲット絞り込み効果 で考える", model:"①賛否両論は感情的な議論を生みSNS拡散を促進する\n②「自分向き」と判断した人の購買意欲が高まりコア顧客を獲得する\n③全員に好かれる製品は誰の記憶にも残らず差別化できない"},
      { q:"無料サンプルを配ると、かえって商品の売上が下がることがある。なぜか？", hint:"①知覚価値の変化　②購買動機の消失　③ブランドポジショニング で考える", model:"①無料体験で「試した」欲求が満たされ購買動機が消える\n②「タダでもらえるもの」という低価値イメージがブランドに定着する\n③本来のターゲット外の人が来店しコア顧客の体験を損ねる"},
      { q:"競合が大規模なテレビCMを打った翌月、自社の売上も増えた。なぜか？", hint:"①市場全体の活性化　②比較購買行動　③カテゴリー認知の向上 で考える", model:"①競合CMがカテゴリー自体への関心を高め潜在顧客が検討を始めた\n②比較検討の過程で自社製品の価格・品質優位性が発見された\n③競合の広告が『このカテゴリーは今アツい』というシグナルとして機能した"},

// ── State ──
let hyp = { cat:'ビジネス', idx:-1, timerID:null, t:90 };
let ai  = { cat:'提案', idx:-1 };

// ── Tab ──
function switchTab(name) {
  ['hypothesis','ai','history'].forEach((t,i) => {
    document.querySelectorAll('.tab')[i].classList.toggle('active', t===name);
    document.getElementById('section-'+t).classList.toggle('active', t===name);
  });
  if (name==='history') renderHistory();
}

// ── Chip ──
function selectChip(el, prefix, cat) {
  el.closest('.chips').querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  if (prefix==='hyp') hyp.cat=cat; else ai.cat=cat;
}

// ── Streak ──
function updateStreak() {
  try {
    const today=new Date().toDateString();
    let d=JSON.parse(localStorage.getItem('dojo-streak')||'{"count":0,"last":""}');
    if (d.last===today){document.getElementById('streak-display').textContent=d.count+'日';return;}
    d.count = d.last===new Date(Date.now()-86400000).toDateString() ? d.count+1 : 1;
    d.last=today;
    localStorage.setItem('dojo-streak',JSON.stringify(d));
    document.getElementById('streak-display').textContent=d.count+'日';
  }catch(e){}
}

// ── 仮説思考 ──
function getHypQuestion() {
  clearInterval(hyp.timerID);
  const pool=BANK.hyp[hyp.cat];
  let n=Math.floor(Math.random()*pool.length);
  while(pool.length>1&&n===hyp.idx) n=Math.floor(Math.random()*pool.length);
  hyp.idx=n;
  const item=pool[n];
  const qEl=document.getElementById('hyp-question');
  qEl.className='question-box';
  qEl.textContent=item.q;
  document.getElementById('hyp-answer').value='';
  document.getElementById('hyp-answer').disabled=false;
  document.getElementById('hyp-hint').classList.remove('visible');
  document.getElementById('hyp-hint-text').textContent=item.hint;
  document.getElementById('hyp-feedback').classList.remove('visible');
  document.getElementById('hyp-timer-row').style.display='flex';
  document.getElementById('hyp-timer-btn').disabled=false;
  document.getElementById('hyp-hint-btn').disabled=false;
  document.getElementById('hyp-submit-btn').disabled=false;
  document.getElementById('hyp-counter').textContent=`問題 ${n+1}/${pool.length}`;
  resetTimer();
}

function resetTimer() {
  hyp.t=90;
  updateTimerDisp();
}
function updateTimerDisp() {
  const el=document.getElementById('hyp-timer');
  el.textContent=String(Math.floor(hyp.t/60)).padStart(2,'0')+':'+String(hyp.t%60).padStart(2,'0');
  el.className='timer'+(hyp.t<=20?' warning':'');
  document.getElementById('hyp-progress').style.width=(hyp.t/90*100)+'%';
}
function startTimer() {
  clearInterval(hyp.timerID);
  hyp.timerID=setInterval(()=>{
    hyp.t--;
    updateTimerDisp();
    if(hyp.t<=0){clearInterval(hyp.timerID);document.getElementById('hyp-timer').textContent='終了！';}
  },1000);
}

function toggleHint(id) { document.getElementById(id).classList.toggle('visible'); }

function submitHyp() {
  const ans=document.getElementById('hyp-answer').value.trim();
  if(!ans){alert('回答を入力してください');return;}
  if(hyp.idx<0){alert('先に「例題を出す」を押してください');return;}
  const item=BANK.hyp[hyp.cat][hyp.idx];
  if(!item){alert('例題を再度取得してください');return;}
  const lines=ans.split('\n').filter(l=>l.trim().length>5);
  const cnt=lines.length;
  const hasReason=/なぜ|ため|から|による|影響|結果/.test(ans);
  const hasDetail=ans.length>80;
  const diversity=cnt>=3?3:cnt>=2?2:1;
  const specificity=hasDetail?(hasReason?3:2):1;
  const depth=(hasReason&&hasDetail)?(cnt>=3?3:2):1;
  const stars=n=>'★'.repeat(n)+'☆'.repeat(3-n);
  let fb='';
  if(cnt<2) fb='仮説が1つだけです。「顧客視点」「競合視点」「内部要因」など視点を変えると仮説が増えます。';
  else if(!hasReason) fb=`${cnt}つ書けています。次は「なぜそうなるか」の根拠を添えましょう。「〜だから〜」という因果を意識すると仮説の質が上がります。`;
  else if(cnt>=3&&hasReason) fb=`${cnt}つの仮説に根拠が伴っています。さらに成長するには「検証方法」まで考える習慣をつけましょう。`;
  else fb=`${cnt}つの仮説に根拠も含まれています。全く異なる視点の仮説をもう一つ加えると思考の幅が広がります。`;
  document.getElementById('hyp-fb-text').textContent=fb;
  document.getElementById('hyp-rubric').innerHTML=`
    <div class="rubric-item"><div class="rubric-label">多様性</div><div class="rubric-stars">${stars(diversity)}</div></div>
    <div class="rubric-item"><div class="rubric-label">具体性</div><div class="rubric-stars">${stars(specificity)}</div></div>
    <div class="rubric-item"><div class="rubric-label">洞察の深さ</div><div class="rubric-stars">${stars(depth)}</div></div>`;
  document.getElementById('hyp-model-text').innerHTML=item.model.replace(/\n/g,'<br>');
  const fbEl=document.getElementById('hyp-feedback');
  fbEl.classList.remove('visible');
  void fbEl.offsetWidth; // force reflow
  fbEl.classList.add('visible');
  fbEl.scrollIntoView({behavior:'smooth',block:'nearest'});
  saveHistory('仮説思考',item.q,ans);
  updateStreak();
}

  fbEl.classList.add('visible');
  fbEl.scrollIntoView({behavior:'smooth',block:'nearest'});
  saveHistory('AI活用',item.q,ans);
  updateStreak();
}

// ── History ──
function saveHistory(type,q,a) {
  try {
    const list=JSON.parse(localStorage.getItem('dojo-history')||'[]');
    list.unshift({type,date:new Date().toLocaleDateString('ja-JP'),q:q.slice(0,80),a:a.slice(0,120)});
    if(list.length>40)list.pop();
    localStorage.setItem('dojo-history',JSON.stringify(list));
  }catch(e){}
}
function renderHistory() {
  const el=document.getElementById('history-list');
  try {
    const list=JSON.parse(localStorage.getItem('dojo-history')||'[]');
    if(!list.length){el.innerHTML='<div class="empty">📭 まだ履歴がありません。例題を解いてみましょう！</div>';return;}
    el.innerHTML=list.map(d=>`
      <div class="history-item">
        <div class="history-meta"><span>${d.date}</span><span>${d.type}</span></div>
        <div class="history-q">Q: ${d.q}${d.q.length>=80?'…':''}</div>
        <div class="history-a">${d.a}${d.a.length>=120?'…':''}</div>
      </div>`).join('');
  }catch(e){el.innerHTML='<div class="empty">履歴を読み込めませんでした</div>';}
}

updateStreak();
</script>
